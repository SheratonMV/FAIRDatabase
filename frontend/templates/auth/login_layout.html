<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>{% block title %}FAIRMicrobiome{% endblock %}</title>
      <link rel="shortcut icon" href="{{ url_for('static', filename='img/metahealth_small.png') }}">

      <!-- Google Fonts: Exo (headings) · Inter (body) · Roboto Mono (data) -->
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
      <!-- Bootstrap CSS, MDB CSS, Custom CSS, Font Awesome -->
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
      <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/3.6.0/mdb.min.css" rel="stylesheet" />
      <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
      <!-- Anti-forgery token (src/csrf.py): attach it to every same-origin
           fetch/XHR that changes something, so page scripts need no edits. -->
      <meta name="csrf-token" content="{{ csrf_token() }}">
      <script>
        (function () {
          var token = document.querySelector('meta[name="csrf-token"]').content;
          var safe = /^(GET|HEAD|OPTIONS|TRACE)$/i;
          function sameOrigin(url) {
            try { return new URL(url, location.href).origin === location.origin; }
            catch (e) { return false; }
          }
          var origFetch = window.fetch;
          window.fetch = function (input, init) {
            init = init || {};
            var method = init.method || (input instanceof Request ? input.method : 'GET');
            var url = input instanceof Request ? input.url : String(input);
            if (!safe.test(method) && sameOrigin(url)) {
              var headers = new Headers(init.headers || (input instanceof Request ? input.headers : undefined));
              headers.set('X-CSRFToken', token);
              init.headers = headers;
            }
            return origFetch.call(this, input, init);
          };
          var origOpen = XMLHttpRequest.prototype.open;
          var origSend = XMLHttpRequest.prototype.send;
          XMLHttpRequest.prototype.open = function (method, url) {
            this._csrfNeeded = !safe.test(method) && sameOrigin(url);
            return origOpen.apply(this, arguments);
          };
          XMLHttpRequest.prototype.send = function () {
            if (this._csrfNeeded) this.setRequestHeader('X-CSRFToken', token);
            return origSend.apply(this, arguments);
          };
        })();
      </script>
   </head>
   <body class="d-flex flex-column" id="body">

      <!-- Navbar -->
      <nav class="navbar navbar-expand-lg navbar-light bg-white">
         <a class="navbar-brand me-2" href="/">
            <img src="{{ url_for('static', filename='img/metahealth_small.png') }}" height="35" alt="MetaHealth Logo" loading="lazy" style="margin-top: -1px;">
         </a>
      </nav>

      <!-- Page content -->
      <div class="container mt-4">{% block content %}{% endblock %}</div>

      <!-- Footer -->
      <footer class="footer custom-footer mt-auto">
         <div class="container text-center">
            <small>FAIRDatabase &copy; <span id="footer-year"></span></small>
            <script>document.getElementById('footer-year').textContent = new Date().getFullYear();</script>
         </div>
      </footer>

      {% block scripts %}
      <!-- Bootstrap JS and dependencies -->
      <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

      <!-- MDB JS, Font Awesome JS, Custom JS -->
      <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/3.6.0/mdb.min.js"></script>
      <script src="https://kit.fontawesome.com/f09ae2d1c7.js" crossorigin="anonymous"></script>
      <script src="{{ url_for('static', filename='script.js') }}"></script>
      {% endblock %}
   </body>
</html>
