# .github/workflows/deploy.yml
name: Deploy FAIRDatabase

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          ./scripts/install-plugin-deps.sh

      - name: Run tests
        run: |
          PYTHONPATH=backend:. pytest backend/tests/ backend/plugins/ -v --tb=short
